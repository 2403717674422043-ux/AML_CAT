version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    container_name: ddosguard_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - ddosguard-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dashboard"]
    container_name: ddosguard_dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - DDOSGUARD_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ddosguard-network

networks:
  ddosguard-network:
    driver: bridge
